<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมงู - Snake Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
        }
        h1 {
            margin-bottom: 10px;
            color: #4ade80;
            text-shadow: 0 0 10px #4ade80;
        }
        .score-board {
            font-size: 22px;
            margin-bottom: 15px;
            display: flex;
            gap: 30px;
        }
        canvas {
            background: #1a1a1a;
            border: 3px solid #4ade80;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
        }
        .controls {
            margin-top: 20px;
            text-align: center;
            color: #aaa;
            font-size: 15px;
        }
        .btn {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            background: #4ade80;
            color: #111;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover {
            background: #22c55e;
            transform: scale(1.05);
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #ef4444;
            text-shadow: 0 0 15px #ef4444;
            display: none;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>🐍 เกมงู</h1>
    
    <div class="score-board">
        <div>คะแนน: <span id="score">0</span></div>
        <div>สูงสุด: <span id="highScore">0</span></div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="game-over" id="gameOverText">เกมจบ!</div>
    </div>

    <button class="btn" onclick="restartGame()">เริ่มใหม่ (R)</button>

    <div class="controls">
        ใช้ปุ่มลูกศร ↑ ↓ ← → หรือ WASD ในการควบคุม<br>
        กดปุ่มทิศทางเพื่อเริ่มเคลื่อนที่ • กด <b>R</b> เพื่อเริ่มใหม่
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameRunning = true;
        let gameStarted = false;   // ยังไม่เริ่มเคลื่อนที่จนกว่าจะกดปุ่ม
        let gameSpeed = 120;

        document.getElementById("highScore").textContent = highScore;

        function drawGame() {
            // ล้างจอ
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดงู
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);

                // ตา
                if (index === 0) {
                    ctx.fillStyle = "#000";
                    const eye = 3;
                    if (dx === 1) {
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 4, eye, eye);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eye, eye);
                    } else if (dx === -1) {
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 4, eye, eye);
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 12, eye, eye);
                    } else if (dy === -1) {
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 4, eye, eye);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 4, eye, eye);
                    } else if (dy === 1) {
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 12, eye, eye);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eye, eye);
                    } else {
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 4, eye, eye);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 12, eye, eye);
                    }
                }
            });

            // วาดอาหาร
            ctx.fillStyle = "#ef4444";
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            document.getElementById("score").textContent = score;
        }

        function moveSnake() {
            if (!gameRunning || !gameStarted) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // ชนขอบ
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // ชนตัวเอง (ข้ามหัวตัวเอง)
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // กินอาหาร
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    document.getElementById("highScore").textContent = highScore;
                }
                if (gameSpeed > 60) gameSpeed -= 2;
                placeFood();
            } else {
                snake.pop();
            }
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            for (let segment of snake) {
                if (food.x === segment.x && food.y === segment.y) {
                    placeFood();
                    return;
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById("gameOverText").style.display = "block";
        }

        function restartGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            gameSpeed = 120;
            gameRunning = true;
            gameStarted = false;
            document.getElementById("gameOverText").style.display = "none";
            placeFood();
            drawGame();
        }

        // ควบคุม
        document.addEventListener("keydown", (e) => {
            if (!gameRunning && e.key.toLowerCase() !== "r") return;

            switch (e.key) {
                case "ArrowUp":
                case "w":
                case "W":
                    if (dy !== 1) { dx = 0; dy = -1; gameStarted = true; }
                    break;
                case "ArrowDown":
                case "s":
                case "S":
                    if (dy !== -1) { dx = 0; dy = 1; gameStarted = true; }
                    break;
                case "ArrowLeft":
                case "a":
                case "A":
                    if (dx !== 1) { dx = -1; dy = 0; gameStarted = true; }
                    break;
                case "ArrowRight":
                case "d":
                case "D":
                    if (dx !== -1) { dx = 1; dy = 0; gameStarted = true; }
                    break;
                case "r":
                case "R":
                    restartGame();
                    break;
            }
        });

        function gameLoop() {
            moveSnake();
            drawGame();
            setTimeout(gameLoop, gameSpeed);
        }

        // เริ่มต้น
        placeFood();
        drawGame();
        gameLoop();
    </script>
</body>
</html>
